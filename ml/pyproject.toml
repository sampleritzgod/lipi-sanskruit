[project]
name = "lipi"
version = "0.1.0"
description = "Manuscript reading and understanding pipeline for Lipi-Sanskruit"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.9.0",
    "fastapi>=0.141.1",
    "numpy>=2.4.6",
    "pillow>=11.0",
    "pillow-heif>=0.21",
    "pypdfium2>=4.30",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "scipy>=1.17.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
lipi-inventory = "lipi.inventory:main"
lipi-segment = "lipi.segment:main"
lipi-transcribe = "lipi.transcribe_app:main"
lipi-web = "lipi.web:main"
lipi-eval = "lipi.evaluate:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lipi"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
